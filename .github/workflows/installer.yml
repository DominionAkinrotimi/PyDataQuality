name: Build installers

# Builds the desktop app that needs no Python and no terminal:
#   Windows: PyDataQuality-Setup.exe
#   macOS (Apple Silicon): PyDataQuality-macOS.zip, holding PyDataQuality.app
# Each build is started and made to check a file before it is kept.
# On a published release the files are attached to that release.

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - "packaging/**"
      - "pydataquality/desktop.py"
      - ".github/workflows/installer.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Build the app
        run: python packaging/build.py
      - name: Check that the built app works
        timeout-minutes: 5
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "app.txt"
          Start-Process -FilePath "dist\PyDataQuality\PyDataQuality.exe" -ArgumentList "--self-test", $result -Wait
          Get-Content $result
          if ((Get-Content $result -Raw).Trim() -ne "ok") { exit 1 }
      - name: Build the setup program
        shell: pwsh
        run: |
          $version = python -c "import pydataquality; print(pydataquality.__version__)"
          iscc "/DAppVersion=$version" packaging\installer.iss
      - name: Install it, and check that the installed app works
        timeout-minutes: 5
        shell: pwsh
        run: |
          Start-Process -FilePath "dist\PyDataQuality-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait
          $app = Join-Path $env:LOCALAPPDATA "Programs\PyDataQuality\PyDataQuality.exe"
          if (-not (Test-Path $app)) { Write-Error "The setup program did not install $app"; exit 1 }
          $result = Join-Path $env:RUNNER_TEMP "installed.txt"
          Start-Process -FilePath $app -ArgumentList "--self-test", $result -Wait
          Get-Content $result
          if ((Get-Content $result -Raw).Trim() -ne "ok") { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: PyDataQuality-Setup-Windows
          path: dist/PyDataQuality-Setup.exe
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/PyDataQuality-Setup.exe --clobber

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Build the app
        run: python packaging/build.py
      - name: Check that the built app works
        timeout-minutes: 5
        run: |
          dist/PyDataQuality.app/Contents/MacOS/PyDataQuality --self-test "$RUNNER_TEMP/app.txt"
          cat "$RUNNER_TEMP/app.txt"
          test "$(cat "$RUNNER_TEMP/app.txt")" = "ok"
      - name: Zip the app
        run: ditto -c -k --sequesterRsrc --keepParent dist/PyDataQuality.app dist/PyDataQuality-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PyDataQuality-macOS
          path: dist/PyDataQuality-macOS.zip
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/PyDataQuality-macOS.zip --clobber
